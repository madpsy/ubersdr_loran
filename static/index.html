<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loran-C Viewer</title>
<style>
  :root {
    --bg:        #0d0d0f;
    --surface:   #16161a;
    --border:    #2a2a30;
    --text:      #e2e2e8;
    --muted:     #6b6b7a;
    --accent:    #00d4ff;
    --ok:        #22c55e;
    --err:       #ef4444;
    --radius:    10px;
    --font:      "Inter", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
    padding: 16px;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, #00d4ff22, #7c3aed22);
    border: 1px solid #00d4ff33;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .header-text p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* ── Status pill ─────────────────────────────────────────── */
  #status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid transparent;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  }

  #status::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-ok {
    background: #16301e;
    color: var(--ok);
    border-color: #22c55e33;
  }
  .status-ok::before  { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

  .status-err {
    background: #2d1515;
    color: var(--err);
    border-color: #ef444433;
  }
  .status-err::before { background: var(--err); }

  /* ── Scope card ──────────────────────────────────────────── */
  #scope-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  #scope-container {
    width: 100%;
    cursor: crosshair;
    background: #000;
  }

  #scope {
    display: block;
    width: 100%;
  }

  /* ── Footer hint ─────────────────────────────────────────── */
  .hint {
    margin-top: 10px;
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📡</div>
  <div class="header-text">
    <h1>Loran-C Viewer</h1>
    <p>100 kHz pulse-envelope scope — 14 chains simultaneously</p>
  </div>
  <span id="status" class="status-err">Connecting…</span>
</header>

<div id="scope-card">
  <div id="scope-container">
    <canvas id="scope"></canvas>
  </div>
</div>

<p class="hint">Click a row to shift-align that chain's master station pulse</p>

<script>window.BASE_PATH = "{{.BasePath}}";</script>
<script src="{{.BasePath}}/loran_c.js"></script>
</body>
</html>
