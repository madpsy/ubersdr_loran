services:
  loran:
    container_name: loran
    image: madpsy/ubersdr_loran:latest
    restart: unless-stopped
    cpu_shares: 256
    environment:
      # UberSDR base URL (required)
      UBERSDR_URL: "http://ubersdr:8080"
      # Bypass password (optional)
      # PASS: ""
      # Web UI port (default: 6088)
      # WEB_PORT: "6088"
      # Scope update rate in Hz (default: 10, use 1 for KiwiSDR-compatible 1 Hz)
      # UPDATE_HZ: "10"
      # Averaging algorithm: 0=CMA, 1=EMA (default), 2=IIR
      # AVG_ALGO: "1"
      # Averaging parameter (meaning depends on algorithm):
      #   EMA → decay constant (default: 256, range 1–512; higher = slower/smoother)
      #   CMA → number of GRI periods to average (default: 8, range 1–32)
      #   IIR → exponential gain factor (default: 0.2, range 0.0–1.0)
      # AVG_PARAM: "256"
      # Reduced-depth IQ: dB the quantisation floor is held below the band
      # noise floor (default: 26 — transparent; 0 = lossless, else 15–60).
      # Lossless costs roughly twice the bandwidth for no visible difference.
      # MIN_MARGIN: "26"
    networks:
      - sdr-network
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: "loran"

networks:
  sdr-network:
    external: true
    name: ubersdr_sdr-network
